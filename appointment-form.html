<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Healthcare Appointment Booking | CareWell Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --health-primary: #0d7c66;
            --health-primary-dark: #0a5f4e;
            --health-primary-light: #1a9e84;
            --health-secondary: #2c7da0;
            --health-soft-bg: #f0f9ff;
            --health-green-soft: #e6f7f2;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Full-page background: healthcare photo + teal overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(13,124,102,0.82) 0%, rgba(44,125,160,0.80) 100%),
                url('https://images.unsplash.com/photo-1584820927498-cfe5211fd8bf?auto=format&fit=crop&w=1400&q=80')
                center/cover no-repeat;
            z-index: -1;
        }

        /* Decorative blur blobs */
        body::after {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            top: -120px; right: -120px;
            z-index: -1;
        }

        .health-form-container {
            max-width: 620px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 30px 60px -10px rgba(0,0,0,0.45);
        }

        /* Header */
        .form-header {
            background: linear-gradient(105deg, var(--health-primary) 0%, var(--health-secondary) 100%);
            padding: 2rem 2rem 1.6rem;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .form-header::before {
            content: '';
            position: absolute;
            width: 220px; height: 220px;
            background: rgba(255,255,255,0.07);
            border-radius: 50%;
            top: -80px; right: -60px;
        }
        .form-header::after {
            content: '';
            position: absolute;
            width: 150px; height: 150px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            bottom: -60px; left: -40px;
        }
        .form-header .icon {
            background: rgba(255,255,255,0.2);
            width: 68px; height: 68px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 1.9rem;
            margin-bottom: 0.9rem;
            position: relative; z-index: 1;
        }
        .form-header h2 {
            font-size: 1.55rem; font-weight: 800;
            margin-bottom: 0.25rem;
            position: relative; z-index: 1;
        }
        .form-header p {
            font-size: 0.82rem; opacity: 0.9;
            position: relative; z-index: 1;
        }
        .secure-badge {
            display: inline-flex;
            align-items: center; gap: 5px;
            background: rgba(255,255,255,0.15);
            border-radius: 2rem;
            padding: 0.3rem 0.9rem;
            font-size: 0.68rem;
            margin-top: 0.6rem;
            position: relative; z-index: 1;
        }

        /* Form body */
        .form-body { padding: 2rem; background: white; }

        .section-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            margin-bottom: 1rem;
            margin-top: 0.3rem;
            display: flex; align-items: center; gap: 8px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2ede8;
        }

        .input-group {
            margin-bottom: 1.1rem;
            display: flex; flex-direction: column;
        }
        .input-group label {
            font-size: 0.78rem; font-weight: 700;
            color: var(--health-primary);
            margin-bottom: 0.4rem;
            display: flex; align-items: center; gap: 6px;
        }
        .input-group input,
        .input-group select {
            padding: 0.82rem 1rem;
            border: 1.5px solid #e2ede8;
            border-radius: 0.9rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            transition: 0.2s;
            background: white;
            color: #1e3a5f;
        }
        .input-group input::placeholder { color: #aab5c2; }
        .input-group select { cursor: pointer; }
        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--health-primary);
            box-shadow: 0 0 0 3px rgba(13,124,102,0.12);
            background: #fafffe;
        }

        .row-2col {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
        }

        .required { color: #e5484d; font-size: 0.68rem; }

        /* Submit */
        .btn-submit {
            width: 100%;
            background: linear-gradient(105deg, var(--health-primary), var(--health-secondary));
            border: none; padding: 1rem;
            border-radius: 3rem;
            font-weight: 800; font-size: 1rem;
            color: white; cursor: pointer;
            margin-top: 0.8rem;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            letter-spacing: 0.01em;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(13,124,102,0.35);
        }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* Status */
        .status-message {
            margin-top: 1rem; padding: 0.8rem 1rem;
            border-radius: 1rem; font-size: 0.83rem;
            display: none; align-items: center; gap: 8px;
        }
        .status-success { background: #d1fae5; color: #065f46; border-left: 4px solid #059669; }
        .status-error   { background: #fee2e2; color: #991b1b; border-left: 4px solid #dc2626; }
        .status-loading { background: #e0f2fe; color: #075985; border-left: 4px solid #0284c7; }

        /* Footer */
        .form-footer {
            background: var(--health-green-soft);
            padding: 0.85rem 2rem;
            text-align: center; font-size: 0.68rem;
            color: #5a6e66;
            border-top: 1px solid #cde3da;
            display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;
        }

        @media (max-width: 550px) {
            body { padding: 1rem; }
            .form-body { padding: 1.5rem; }
            .row-2col { grid-template-columns: 1fr; gap: 0; }
            .form-header { padding: 1.5rem 1.4rem 1.2rem; }
        }
    </style>
</head>
<body>
<div class="health-form-container">

    <!-- Header -->
    <div class="form-header">
        <div class="icon"><i class="fas fa-calendar-check"></i></div>
        <h2 id="clinicName">CareWell Hospital</h2>
        <p>Book an Appointment · Health Checkup · Specialist Care</p>
        <div class="secure-badge">
            <i class="fas fa-lock"></i> Your information is secure &amp; confidential
        </div>
    </div>

    <!-- Form -->
    <div class="form-body">
        <form id="appointmentForm">

            <div class="section-label">Personal Details</div>

            <!-- Full Name -->
            <div class="input-group">
                <label><i class="fas fa-user"></i> Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" name="fullName" placeholder="e.g. Priya Sharma" required>
            </div>

            <!-- Email & Mobile -->
            <div class="row-2col">
                <div class="input-group">
                    <label><i class="fas fa-envelope"></i> Email ID <span class="required">*</span></label>
                    <input type="email" id="emailId" name="emailId" placeholder="patient@example.com" required>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-phone-alt"></i> Mobile <span class="required">*</span></label>
                    <input type="tel" id="mobileNo" name="mobileNo" placeholder="9876543210" required>
                </div>
            </div>

            <!-- Gender & Age -->
            <div class="row-2col">
                <div class="input-group">
                    <label><i class="fas fa-venus-mars"></i> Gender <span class="required">*</span></label>
                    <select id="gender" name="gender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-birthday-cake"></i> Age <span class="required">*</span></label>
                    <input type="number" id="age" name="age" placeholder="e.g. 35" min="0" max="120" required>
                </div>
            </div>

            <div class="section-label">Appointment Details</div>

            <!-- City -->
            <div class="input-group">
                <label><i class="fas fa-map-marker-alt"></i> City <span class="required">*</span></label>
                <select id="city" name="city" required>
                    <option value="">-- Select Your City --</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Kolkata">Kolkata</option>
                    <option value="Bangalore">Bangalore</option>
                </select>
            </div>

            <!-- Interested In -->
            <div class="input-group">
                <label><i class="fas fa-notes-medical"></i> Interested In <span class="required">*</span></label>
                <select id="interestedIn" name="interestedIn" required>
                    <option value="">-- Select Service --</option>
                    <option value="Wellness Program">Wellness Program</option>
                    <option value="Preventive Health Checkup">Preventive Health Checkup</option>
                    <option value="Specialist Consultation">Specialist Consultation</option>
                </select>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Confirm Appointment
            </button>
            <div id="formStatus" class="status-message"></div>

        </form>
    </div>

    <!-- Footer -->
    <div class="form-footer">
        <span><i class="fas fa-clock"></i> Mon–Sat: 9am – 8pm</span>
        <span><i class="fas fa-shield-alt"></i> Data Protected</span>
        <span><i class="fas fa-ambulance"></i> Emergency: 24/7</span>
    </div>

</div>

<script>
    // ============================================
    // ⚡ EASY CUSTOMIZATION
    // ============================================
    const CLINIC_NAME    = "CareWell Hospital";
    const API_BASE_URL   = "https://formapiv5.resul.io/Subscription/IndexInsertAPI";
    const FORM_ID        = "3127";
    const DB_ID          = "53efc8a6_3a68_4e05_a818_bdd2d932b164";
    const NOTIFY_STATUS  = "false";
    const FORM_STYLES    = "healthcare_appointment_form";
    // ============================================

    document.getElementById("clinicName").innerText = CLINIC_NAME;

    const form      = document.getElementById("appointmentForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusDiv = document.getElementById("formStatus");

    function generateId(prefix) {
        return prefix + '_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
    }

    function showMessage(type, text) {
        const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', loading: 'fa-spinner fa-pulse' };
        statusDiv.style.display = "flex";
        statusDiv.innerHTML = `<i class="fas ${icons[type]}"></i> <span>${text}</span>`;
        statusDiv.className = `status-message status-${type}`;
        if (type !== 'loading') {
            setTimeout(() => { statusDiv.style.display = 'none'; }, 6000);
        }
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const Name        = document.getElementById("fullName").value.trim();
        const EmailID     = document.getElementById("emailId").value.trim();
        const MobileNo    = document.getElementById("mobileNo").value.trim();
        const Gender      = document.getElementById("gender").value;
        const Age         = document.getElementById("age").value;
        const City        = document.getElementById("city").value;
        const InterestedIn = document.getElementById("interestedIn").value;

        if (!Name)       { showMessage("error", "Please enter patient's full name"); return; }
        if (!EmailID || !/^\S+@\S+\.\S+$/.test(EmailID)) { showMessage("error", "Valid email address required"); return; }
        if (!MobileNo || !/^\d{7,15}$/.test(MobileNo.replace(/\s/g, ''))) { showMessage("error", "Valid mobile number required"); return; }
        if (!Gender)     { showMessage("error", "Please select gender"); return; }
        if (!Age || Age < 0 || Age > 120) { showMessage("error", "Please enter valid age"); return; }
        if (!City)       { showMessage("error", "Please select your city"); return; }
        if (!InterestedIn) { showMessage("error", "Please select a service"); return; }

        const params = new URLSearchParams();
        params.append('Name',           Name);
        params.append('EmailID',        EmailID);
        params.append('MobileNo',       MobileNo);
        params.append('Gender',         Gender);
        params.append('Age',            Age);
        params.append('City',           City);
        params.append('Interested In',  InterestedIn);
        params.append('FormStyles',     FORM_STYLES);
        params.append('formId',         FORM_ID);
        params.append('dbId',           DB_ID);
        params.append('SourceURL',      window.location.href);
        params.append('pagereferrerurl', document.referrer || "direct");
        params.append('rid',            generateId("rid"));
        params.append('cid',            generateId("cid"));
        params.append('pagetitle',      document.title);
        params.append('notifyStatus',   NOTIFY_STATUS);

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Booking...';
        showMessage("loading", "Submitting your appointment request...");

        try {
            const response = await fetch(`${API_BASE_URL}?${params.toString()}`, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });

            let data;
            const ct = response.headers.get('content-type');
            if (ct && ct.includes('application/json')) {
                data = await response.json();
            } else {
                const raw = await response.text();
                try { data = JSON.parse(raw); } catch(e) { data = { result: false }; }
            }

            if (response.ok && (data.result === true || data.statusId === 200)) {
                showMessage("success", "✅ Appointment request submitted! Our team will contact you within 2 hours.");
                form.reset();
            } else {
                showMessage("error", `⚠️ ${data.message || "Unable to submit. Please try again."}`);
            }
        } catch (err) {
            console.error("API error:", err);
            showMessage("error", "Network issue. Please check your connection and try again.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Confirm Appointment';
        }
    });
</script>
</body>
</html>
